{{ define "main" }}

<div style="height: 100vh; background:white;">
<section class="site-about-header">
  <div class="container">
    <div class="row"> 
      <div class="col-12">
        <div class="site-about-wrapper">
          <div class="site-about-company" style="display: flex;justify-content: center;align-content: center;">
             <img src="{{ "images/about_img.jpg" | absURL }}" class="rounded-circle" alt="my photo" style="width:80%;" />
          </div>
          <div class="site-about-description">
            <p>
              {{ .Description }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<div style="background-color:#f7f9ff; display: flex; align-items: center;justify-content: center;">
  <h5 class="reminder_text"> - click anywhere on this page - </h5>
</div>
<section class="site-expertise">
  <div class="container">
    <div class="row">
      {{ with .Params.expertise_title }}
      <div class="col-md-5">
        <div class="section-title">
          <h2>{{ . }}</h2>
        </div>
      </div>
      {{ end }}
      <div class="col-md-6">
        <ul class="site-expertise-list">
          {{ range .Params.expertise_sectors }}
          <li>{{ . }}</li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</section>
</div>

<script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
<script src="http://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="../js/p5.min.js" type="text/javascript"></script>
<script src="../js/fallCat.js" type="text/javascript"></script>

{{ end }}
