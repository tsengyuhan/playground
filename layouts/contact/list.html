{{ define "main" }}
<section class="site-contact" id="range">
  <a href= "mailto: tyhcindy@gmail.com" target="_blank" class="email reminder_text" id="contact"> Contact Me </a>
  <div class="bg">
      <a href= "mailto: tyhcindy@gmail.com" target="_blank" class="email show"> Contact Me </a>
      <p class="reminder_text" style="color: rgb(82, 81, 81);">inspired by Google paw print game for 2022 International Cat Day</p>
  </div>
</section>

<style>
  .bg{
    width: 100%;
    height:100%;
    background-color: rgb(247, 249, 255);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
  }
  .email{
    font-size: 60px;
    z-index:1000;
    color: rgb(246, 159, 159);
    position: absolute;
  }

  .email:hover{
    color: #096472;
  }

  #btn{
    z-index: 2000;
  }

  .reminder_text{
    visibility: visible;
  }

  .show{
    visibility: hidden;
  }

  @media only screen and (max-width:991px) {
    
    .show{
      visibility: visible;
    }
    .reminder_text{
      visibility: hidden;
    }
  }

</style>

<script src="../js/p5.min.js" type="text/javascript"></script>
<script src="../js/footprint.js" type="text/javascript"></script>
<script src="../js/contact.js" type="text/javascript"></script>

{{ end }}
