baseURL = "https://yuhantyh.gitlab.io/playground"
title = "YUHAN's PLAYGROUND"
author = "Yuhan Tseng"
copyright = "© 2022, Yuhan Tseng"

# how many posts in one page
paginate = 4

languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
footnoteReturnLinkContents = "^"
theme = "origin"

ignoreErrors = ["error-missing-instagram-accesstoken"]

[params]
  description = "Interactive Installation / New Media / Cats"
  featured = true
  cssonly = false

  [params.socials]
    facebook = ""
    twitter = ""
    instagram = ""
    youtube = ""
    github = ""
    gitlab = ""
    linkedin = ""
    slack = ""
    stackoverflow = ""
    medium= ""

[menu]

  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "../"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2

  [[menu.main]]
    identifier = "works"
    name = "Works"
    url = "/works/"
    weight = 3
  
  [[menu.main]]
    identifier = "fun"
    name = "Fun"
    url = "/fun/"
    weight = 4

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.highlight]
    style = "github"
    tabWidth = 4

[markup.goldmark.renderer]
unsafe = true

